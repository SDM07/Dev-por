parameters:
  - name: environment
    type: string
  - name: dependsOn
    type: string
  - name: condition
    type: string

stages:
  - stage: Deploy_${{ parameters.environment }}
    displayName: Desplegar ${{ upper(parameters.environment) }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    variables:
      # Debe contener: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_API_SCOPE, ADMIN_ROLE,
      #                TF_STATE_BUCKET, TF_LOCK_TABLE, AWS_REGION
      - group: devportal-${{ parameters.environment }}
      - name: AWS_CONNECTION
        value: aws-devportal-${{ parameters.environment }}
    jobs:
      - deployment: Deploy
        pool: { vmImage: ubuntu-latest }
        environment: devportal-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: lambda
                - download: current
                  artifact: infra
                - download: current
                  artifact: frontend-src

                - script: |
                    curl -sSLo tf.zip https://releases.hashicorp.com/terraform/$(TERRAFORM_VERSION)/terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
                    sudo unzip -oq tf.zip -d /usr/local/bin
                  displayName: Instalar Terraform

                - task: AWSShellScript@1
                  displayName: Terraform apply (S3, CloudFront, Route 53, WAF, Lambda, API GW, CloudWatch)
                  inputs:
                    awsCredentials: $(AWS_CONNECTION)
                    regionName: $(AWS_REGION)
                    scriptType: inline
                    inlineScript: |
                      set -euo pipefail
                      cd $(Pipeline.Workspace)/infra/terraform
                      terraform init -input=false \
                        -backend-config="bucket=$(TF_STATE_BUCKET)" \
                        -backend-config="key=developer-portal/${{ parameters.environment }}/terraform.tfstate" \
                        -backend-config="region=$(AWS_REGION)" \
                        -backend-config="dynamodb_table=$(TF_LOCK_TABLE)" \
                        -backend-config="encrypt=true"
                      terraform apply -input=false -auto-approve \
                        -var-file=environments/${{ parameters.environment }}.tfvars \
                        -var="azure_tenant_id=$(AZURE_TENANT_ID)" \
                        -var="azure_client_id=$(AZURE_CLIENT_ID)" \
                        -var="lambda_package_path=$(Pipeline.Workspace)/lambda/lambda.zip"
                      echo "##vso[task.setvariable variable=SITE_BUCKET]$(terraform output -raw site_bucket)"
                      echo "##vso[task.setvariable variable=DISTRIBUTION_ID]$(terraform output -raw cloudfront_distribution_id)"

                - task: NodeTool@0
                  inputs: { versionSpec: $(NODE_VERSION) }

                - script: |
                    set -e
                    npm ci
                    npm run build
                  workingDirectory: $(Pipeline.Workspace)/frontend-src
                  displayName: Build del frontend (${{ parameters.environment }})
                  env:
                    VITE_USE_MOCKS: 'false'
                    VITE_AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                    VITE_AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
                    VITE_API_SCOPE: $(AZURE_API_SCOPE)
                    VITE_ADMIN_ROLE: $(ADMIN_ROLE)
                    VITE_API_BASE_URL: /api

                - task: AWSShellScript@1
                  displayName: Publicar en S3 e invalidar CloudFront
                  inputs:
                    awsCredentials: $(AWS_CONNECTION)
                    regionName: $(AWS_REGION)
                    scriptType: inline
                    inlineScript: |
                      set -euo pipefail
                      cd $(Pipeline.Workspace)/frontend-src/dist
                      # Assets con hash: caché de 1 año. index.html: siempre revalidar.
                      aws s3 sync . s3://$(SITE_BUCKET) --delete --exclude index.html \
                        --cache-control "public,max-age=31536000,immutable"
                      aws s3 cp index.html s3://$(SITE_BUCKET)/index.html \
                        --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html; charset=utf-8"
                      aws cloudfront create-invalidation --distribution-id $(DISTRIBUTION_ID) --paths "/index.html" "/"
